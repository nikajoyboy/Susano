<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Susano OS</title>
  <desc id="desc">A polished Susano OS terminal menu with system status and eight navigation options.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#111c34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity=".04"/>
    </linearGradient>
    <style><![CDATA[
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #8998b5; }
      .bright { fill: #edf2ff; }
      .accent { fill: #b7a4ff; }
      .label { font-size: 13px; letter-spacing: 1.8px; font-weight: 700; }
      .menu { font-size: 17px; }
    ]]></style>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="1080" cy="100" r="250" fill="#5b5bd6" opacity=".055"/>
  <circle cx="1080" cy="100" r="180" fill="none" stroke="#9b8cff" stroke-opacity=".09"/>
  <path d="M0 250h1280M0 652h1280" stroke="#a8b8dc" stroke-opacity=".08"/>

  <g transform="translate(80 68)">
    <path d="M20 0 39 8v17c0 14-8 25-19 31C9 50 1 39 1 25V8L20 0Z" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="m12 25 6 6 12-14" fill="none" stroke="#b7a4ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="25" class="bright" font-size="18" font-weight="700" letter-spacing="2">SUSANO <tspan fill="#9aa8c3" font-weight="500">OS</tspan></text>
    <text x="56" y="47" class="muted mono" font-size="11" letter-spacing="1.3">SECURE  /  MODULAR  /  REPRODUCIBLE</text>
  </g>
  <g transform="translate(1004 84)">
    <circle cx="6" cy="6" r="4" fill="#4adea4"/>
    <text x="19" y="10" class="muted mono" font-size="12" letter-spacing="1">SYSTEM READY</text>
  </g>

  <text x="80" y="184" class="bright" font-size="62" font-weight="750" letter-spacing="-2">SUSANO</text>
  <text x="83" y="221" class="muted" font-size="18">A focused environment for secure research and reliable operations.</text>
  <text x="1198" y="207" text-anchor="end" class="muted mono" font-size="12" letter-spacing="1.5">VERSION 01.0</text>

  <g>
    <rect x="64" y="278" width="1152" height="358" rx="14" fill="#111a2d" stroke="#34415d" stroke-opacity=".85"/>
    <path d="M78 278h1124a14 14 0 0 1 14 14v34H64v-34a14 14 0 0 1 14-14Z" fill="#19243b"/>
    <path d="M64 326h1152" stroke="#34415d"/>
    <circle cx="91" cy="301" r="5" fill="#f87171"/>
    <circle cx="110" cy="301" r="5" fill="#fbbf24"/>
    <circle cx="129" cy="301" r="5" fill="#4adea4"/>
    <text x="160" y="306" class="muted mono" font-size="13">SUSANO  /  MAIN MENU</text>
    <text x="1184" y="306" text-anchor="end" class="muted mono" font-size="12">TTY 01</text>

    <text x="104" y="361" class="muted label">SELECT AN OPTION</text>
    <rect x="96" y="375" width="716" height="34" rx="6" fill="url(#active)" stroke="#8b5cf6" stroke-opacity=".35"/>
    <rect x="96" y="375" width="3" height="34" rx="1.5" fill="#a78bfa"/>

    <g class="menu mono">
      <text x="116" y="398" class="accent">01</text><text x="158" y="398" class="bright">Launch interactive scan</text><text x="786" y="398" text-anchor="end" class="muted" font-size="13">TUI</text>
      <text x="116" y="434" class="muted">02</text><text x="158" y="434" class="bright">Quick scan — local path</text>
      <text x="116" y="470" class="muted">03</text><text x="158" y="470" class="bright">Quick scan — URL or domain</text>
      <text x="116" y="506" class="muted">04</text><text x="158" y="506" class="bright">System status</text>
      <text x="116" y="542" class="muted">05</text><text x="158" y="542" class="bright">First-boot / LLM setup</text>
      <text x="116" y="578" class="muted">06</text><text x="158" y="578" class="bright">Screensaver</text>
      <text x="116" y="614" class="muted">07</text><text x="158" y="614" class="bright">Open shell</text>
    </g>

    <path d="M844 346v260" stroke="#34415d"/>
    <text x="884" y="361" class="muted label">ENVIRONMENT</text>
    <rect x="884" y="380" width="284" height="206" rx="10" fill="#0c1425" stroke="#2c3953"/>
    <g class="mono" font-size="13">
      <text x="908" y="414" class="muted">PROFILE</text><text x="1144" y="414" text-anchor="end" class="bright">DEFENSIVE</text>
      <path d="M908 429h236" stroke="#293650"/>
      <text x="908" y="457" class="muted">RUNTIME</text><text x="1144" y="457" text-anchor="end" class="bright">SANDBOXED</text>
      <path d="M908 472h236" stroke="#293650"/>
      <text x="908" y="500" class="muted">BUILD</text><text x="1144" y="500" text-anchor="end" class="bright">REPRODUCIBLE</text>
      <path d="M908 515h236" stroke="#293650"/>
      <text x="908" y="543" class="muted">NETWORK</text><text x="1144" y="543" text-anchor="end" fill="#4adea4">PROTECTED</text>
    </g>
    <text x="884" y="615" class="muted mono" font-size="11">Use ↑ ↓ to navigate · Enter to select</text>
  </g>

  <text x="80" y="686" class="muted mono" font-size="12">SUSANO OS</text>
  <text x="1200" y="686" text-anchor="end" class="muted mono" font-size="12">[ 1–8 ] SELECT  <tspan fill="#b7a4ff">›</tspan></text>
</svg>
