  <text x="49" y="122" class="purple">==૮ (♡) ૮==</text><text x="56" y="138" class="purple">/|_|\</text>
  <text x="56" y="154" class="green">[ Overcharged with Love &amp; Happiness! ]</text>
  <text x="14" y="187" class="muted">Thought Bubble:</text>
  <text x="27" y="204">"Beep beep! Thank you for looking after me, I love being your cyber familiar! 💜"</text>
  <text x="28" y="232">Hunger</text><text x="98" y="232">[</text><rect x="105" y="222" width="105" height="16" fill="url(#green)"/><text x="211" y="232">]</text><text x="238" y="232">99%</text>
  <text x="280" y="232">Love</text><text x="350" y="232">[</text><rect x="357" y="222" width="105" height="16" fill="#ed71bc"/><text x="463" y="232">]</text><text x="489" y="232">99%</text>
  <text x="28" y="250">Energy</text><text x="98" y="250">[</text><rect x="105" y="240" width="98" height="16" fill="#36b9e8"/><text x="211" y="250">]</text><text x="238" y="250">94%</text>
  <text x="280" y="250">Hygiene</text><text x="350" y="250">[</text><rect x="357" y="240" width="98" height="16" fill="url(#green)"/><text x="463" y="250">]</text><text x="489" y="250">94%</text>
  <text x="28" y="267" class="muted">Status: <tspan class="purple">Ecstatic &amp; Loved</tspan>  |  Age: 0 days  |  Cuddles: 1</text>
  <path d="M15 294H672M15 373H672" class="line"/>
  <text x="15" y="314"><tspan class="purple">1)</tspan> Feed (RAM, Packets, Cookies)</text><text x="260" y="314"><tspan class="purple">4)</tspan> Clean &amp; Patch (Hygiene)</text>
  <text x="15" y="330"><tspan class="purple">2)</tspan> Love &amp; Cuddle (Pats, Hugs, Talk)</text><text x="260" y="330"><tspan class="purple">5)</tspan> Sleep / Wake</text>
  <text x="15" y="346"><tspan class="purple">3)</tspan> Play Cyber Game</text><text x="260" y="346"><tspan class="purple">6)</tspan> Rename Familiar</text>
  <text x="15" y="362"><tspan class="purple">7)</tspan> <tspan class="muted">Ask AI Thought</tspan></text><text x="260" y="362"><tspan class="purple">8)</tspan> <tspan class="muted">Return to Susano Console</tspan></text>
  <text x="15" y="395">What will you do? [1–8]: <tspan fill="#e6ddfa">█</tspan></text>
</svg>
