<svg xmlns="http://www.w3.org/2000/svg" width="687" height="850" viewBox="0 0 687 850" role="img" aria-labelledby="title desc">
  <title id="title">Susano OS companion interface</title>
  <desc id="desc">A terminal-style cyber familiar care screen with status bars and actions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1d1b2b"/><stop offset="1" stop-color="#211e31"/></linearGradient>
    <linearGradient id="green"><stop stop-color="#40d991"/><stop offset="1" stop-color="#4be47d"/></linearGradient>
    <style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;fill:#d7c9ed}.muted{fill:#8993aa}.purple{fill:#bd77ff}.pink{fill:#ed71bc}.green{fill:#4be47d}.line{stroke:#a24cff;stroke-width:1}</style>
  </defs>
  <rect width="687" height="850" fill="url(#bg)"/>
  <rect x="16" y="20" width="444" height="35" fill="none" stroke="#a74cff"/>
  <rect x="19" y="23" width="438" height="29" fill="none" stroke="#59317d"/>
